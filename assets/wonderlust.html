<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderlust | AI Generated Inspiration</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos para esta página de video full-screen */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Evita scrolls */
            font-family: 'Lato', sans-serif;
            color: #fff;
            background-color: #000; /* Fondo negro por si el video tarda en cargar */
        }

        .fullscreen-video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Fondo de respaldo */
        }

        .fullscreen-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -1; /* Envía el video al fondo */
            filter: grayscale(100%) contrast(1.2); /* Monocromático */
        }

        .video-content {
            position: relative;
            z-index: 1; /* Para que el texto esté encima del video */
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.5); /* Overlay oscuro para legibilidad del texto */
            padding: 2rem;
        }

        .video-content h1 {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            color: #fff;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
            margin-bottom: 1rem;
        }

        .video-content p {
            font-size: 1.2rem;
            max-width: 800px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
            margin-bottom: 2rem;
        }

        .video-content .btn-back {
            background-color: var(--primary-color); /* Usamos el color principal de tu tema */
            color: #fff;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .video-content .btn-back:hover {
            background-color: #a060d0; /* Un tono ligeramente más claro */
            color: #fff;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .video-content h1 {
                font-size: 2rem;
            }
            .video-content p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="fullscreen-video-container">
        <video autoplay muted loop playsinline class="fullscreen-video">
            <source src="assets/wonderlust_video.mp4" type="video/mp4">
            Tu navegador no soporta videos HTML5.
        </video>
        <div class="video-content">
            <h1>Wonderlust: AI-Generated Aesthetic</h1>
            <p>This visual concept, reminiscent of a "Wadruna" style, was crafted using AI generation. It embodies the structured, ethereal flow of data and innovation at the heart of my development philosophy.</p>
            <a href="index.html" class="btn-back">Back to Portfolio Hub</a>
        </div>
    </div>
</body>
</html>
